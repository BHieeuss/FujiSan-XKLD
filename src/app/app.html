<app-loading [isVisible]="isLoading()"></app-loading>

@if (isHomePage()) {
  <app-sakura></app-sakura>
}

@if (!isAdminArea() && !isPracticeMode()) {
  <app-header></app-header>
}

<main
  class="app-route-content"
  [class.app-route-content--refined]="!isPracticeMode()"
  [class.app-route-content--practice]="isPracticeMode()"
>
  <router-outlet></router-outlet>
</main>

@if (!isAdminArea() && !isPracticeMode()) {
  <app-footer></app-footer>
}
