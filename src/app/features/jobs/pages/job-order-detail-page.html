<main class="job-detail-page">
  @if (loading) {
    <div class="job-detail-state"><i class="fas fa-spinner fa-spin"></i> Đang tải đơn hàng...</div>
  } @else if (!order) {
    <div class="job-detail-state">
      <i class="fas fa-circle-exclamation"></i>
      <p>{{ errorMessage || 'Không tìm thấy đơn hàng.' }}</p>
      <a routerLink="/don-hang">Quay lại danh sách đơn hàng</a>
    </div>
  } @else {
    <section class="job-detail-poster">
      <div class="container">
        <a class="job-detail-back" routerLink="/don-hang"><i class="fas fa-arrow-left"></i> Danh sách đơn hàng</a>
        <figure>
          <div class="job-detail-media">
            <img [src]="order.imageUrl" [alt]="'Ảnh ' + orderTitle(order)" />
          </div>
          <figcaption>
            <span class="job-detail-category">
              <i [class]="orderCategory(order).icon"></i>
              {{ orderCategory(order).label }}
            </span>
            <h1>{{ orderTitle(order) }}</h1>
            @if (order.description) {
              <div class="job-detail-description" [innerHTML]="order.description"></div>
            }
          </figcaption>
        </figure>
      </div>
    </section>
  }
</main>
